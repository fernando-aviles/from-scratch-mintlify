openapi: 3.1.0
info:
  title: Relaybox API
  version: "3.4.0"
  description: |
    The Relaybox API lets you publish events, manage endpoints, and inspect deliveries.
    All requests must be made over HTTPS and authenticated with an API key.
  contact:
    name: Relaybox Support
    email: support@relaybox.dev
servers:
  - url: https://api.relaybox.dev/v3
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Events
    description: Publish, list, and replay events.
  - name: Endpoints
    description: Manage the URLs that receive events.

paths:
  /events:
    post:
      tags: [Events]
      summary: Publish an event
      description: |
        Publishes a new event. Relaybox stores the event and delivers it asynchronously
        to every endpoint subscribed to its type. A successful response means the event
        was accepted, not that it has been delivered.
      operationId: createEvent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
            example:
              type: order.paid
              ordering_key: customer_381
              payload:
                order_id: ord_8Hx2kP
                amount: 4200
                currency: usd
      responses:
        "202":
          description: The event was accepted for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          description: The idempotency key was already used with a different request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      tags: [Events]
      summary: List events
      description: Returns events in reverse chronological order. Results are paginated with cursors.
      operationId: listEvents
      parameters:
        - name: type
          in: query
          description: Only return events of this type. Supports wildcards such as `order.*`.
          schema:
            type: string
        - name: created_after
          in: query
          description: Only return events created after this time.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  next_cursor:
                    type: [string, "null"]
                    description: Pass this as `cursor` to get the next page. `null` when there are no more results.

  /events/{event_id}:
    get:
      tags: [Events]
      summary: Retrieve an event
      description: Retrieves a single event, including a summary of its delivery status for each endpoint.
      operationId: getEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"

  /events/replay:
    post:
      tags: [Events]
      summary: Replay events
      description: |
        Re-sends past events to one or more endpoints. Replays are processed in the
        background; large replays may take several minutes to complete.
      operationId: replayEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint_id]
              properties:
                endpoint_id:
                  type: string
                  description: The endpoint to replay events to.
                event_ids:
                  type: array
                  items:
                    type: string
                  description: Specific events to replay. Can't be combined with `since` and `until`.
                since:
                  type: string
                  format: date-time
                  description: Replay events created at or after this time.
                until:
                  type: string
                  format: date-time
                  description: Replay events created before this time.
                status:
                  type: string
                  enum: [failed, all]
                  default: failed
                  description: Replay only events that failed for this endpoint, or every event.
      responses:
        "202":
          description: The replay was scheduled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  replay_id:
                    type: string
                    example: rpl_3Fk8Lm
                  event_count:
                    type: integer
                    description: The number of events that will be re-sent.
                    example: 1284

  /endpoints:
    post:
      tags: [Endpoints]
      summary: Create an endpoint
      description: Creates an endpoint. The signing secret is returned only in this response.
      operationId: createEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointCreate"
      responses:
        "201":
          description: The endpoint was created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Endpoint"
                  - type: object
                    properties:
                      signing_secret:
                        type: string
                        description: The endpoint's signing secret. Store it securely; it won't be shown again.
                        example: whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw
        "400":
          $ref: "#/components/responses/InvalidRequest"
    get:
      tags: [Endpoints]
      summary: List endpoints
      description: Returns all endpoints in the environment.
      operationId: listEndpoints
      parameters:
        - name: status
          in: query
          description: Only return endpoints in this state.
          schema:
            type: string
            enum: [enabled, paused, disabled, pending_verification]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Endpoint"
                  next_cursor:
                    type: [string, "null"]

  /endpoints/{endpoint_id}:
    patch:
      tags: [Endpoints]
      summary: Update an endpoint
      description: Updates an endpoint. Only the fields you send are changed.
      operationId: updateEndpoint
      parameters:
        - $ref: "#/components/parameters/EndpointId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                description:
                  type: string
                event_types:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                  enum: [enabled, paused]
                  description: Pause or resume the endpoint. You can't set an endpoint to `disabled` directly.
      responses:
        "200":
          description: The updated endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Endpoints]
      summary: Delete an endpoint
      description: Permanently deletes an endpoint. Pending deliveries to this endpoint are cancelled.
      operationId: deleteEndpoint
      parameters:
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "204":
          description: The endpoint was deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /endpoints/{endpoint_id}/rotate-secret:
    post:
      tags: [Endpoints]
      summary: Rotate an endpoint's signing secret
      description: |
        Generates a new signing secret. For the duration of the overlap period, requests are signed
        with both the old and the new secret, so you can deploy the new secret without dropping events.
      operationId: rotateEndpointSecret
      parameters:
        - $ref: "#/components/parameters/EndpointId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                overlap_hours:
                  type: integer
                  minimum: 0
                  maximum: 168
                  default: 24
                  description: How long the old secret stays valid. Use `0` if the old secret was leaked.
      responses:
        "200":
          description: The new secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  signing_secret:
                    type: string
                    example: whsec_C2FVsBQIhrscChlQIMV+b5sSYspob7oD
                  old_secret_expires_at:
                    type: string
                    format: date-time

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Your Relaybox API key, for example `rbx_live_...`.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: A unique key that makes the request safe to retry. Keys expire after 24 hours.
      schema:
        type: string
        maxLength: 255
    Limit:
      name: limit
      in: query
      description: The maximum number of results to return, between 1 and 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` value from a previous response.
      schema:
        type: string
    EventId:
      name: event_id
      in: path
      required: true
      description: The ID of the event, starting with `evt_`.
      schema:
        type: string
    EndpointId:
      name: endpoint_id
      in: path
      required: true
      description: The ID of the endpoint, starting with `ep_`.
      schema:
        type: string

  schemas:
    EventCreate:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          description: The event type, such as `order.paid`. Lowercase and dot-separated.
          maxLength: 128
        payload:
          type: object
          description: Your event data. Any JSON object up to 256 KB.
          additionalProperties: true
        ordering_key:
          type: string
          description: Events with the same ordering key are delivered to each endpoint in order.
          maxLength: 256
        application:
          type: string
          description: Deliver only to this application's endpoints. Use your own customer ID.
        metadata:
          type: object
          description: Up to 20 string key-value pairs for filtering and routing.
          additionalProperties:
            type: string

    Event:
      type: object
      properties:
        id:
          type: string
          example: evt_2b7XqLm9TfR4
        type:
          type: string
          example: order.paid
        created_at:
          type: string
          format: date-time
        ordering_key:
          type: [string, "null"]
        payload:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties:
            type: string
        deliveries:
          type: array
          description: A summary of delivery status for each subscribed endpoint.
          items:
            type: object
            properties:
              endpoint_id:
                type: string
              status:
                type: string
                enum: [pending, delivered, failed, skipped]
                description: "`skipped` means a transformation returned `null`."
              attempts:
                type: integer

    EndpointCreate:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: The URL to deliver events to. Must use HTTPS in production.
        description:
          type: string
          description: A human-readable note that appears in the dashboard.
        event_types:
          type: array
          items:
            type: string
          description: Event types to subscribe to. Omit to subscribe to all events.
        rate_limit:
          type: object
          properties:
            requests:
              type: integer
            per:
              type: string
              enum: [second, minute]

    Endpoint:
      type: object
      properties:
        id:
          type: string
          example: ep_5Np8Wz
        url:
          type: string
          format: uri
        description:
          type: string
        event_types:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [enabled, paused, disabled, pending_verification]
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: A machine-readable error code. See the Errors page for the full list.
              example: invalid_request
            message:
              type: string
              description: A human-readable explanation. Don't parse this; it may change.
              example: "The field `type` is required."
            request_id:
              type: string
              description: Include this when contacting support.
              example: req_8sKd02LmQ
            docs_url:
              type: string
              format: uri

  responses:
    InvalidRequest:
      description: The request was malformed or missing a required field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource doesn't exist in this environment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests. Wait for the number of seconds in the `Retry-After` header.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
